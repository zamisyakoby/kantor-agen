<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kantor Agen Ozami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#17110E;--panel:#211915;--line:#3A2C25;--fg:#F1E9E1;--muted:#B3A398;--accent:#E8A49A;--ok:#8FD19E;--no:#F2A0A0;
 --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;--hand:"Caveat","Segoe Print",cursive}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans)}
body{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:1040px;padding:14px 14px 28px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-size:22px;font-weight:600;letter-spacing:.2px}
header p{color:var(--muted);font-size:13px;text-align:right}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}}
.scene{position:relative;background:#120C0A;border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges}
#over{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,0);font-size:10px;color:var(--muted);white-space:nowrap;text-shadow:0 1px 0 #000}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--fg);color:#17110E;font:600 17px/1 var(--hand);padding:4px 9px 5px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .25s;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.bub.on{opacity:1}
.bub::after{content:"";position:absolute;left:50%;bottom:-4px;width:7px;height:7px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.load{position:absolute;inset:0;display:grid;place-items:center;background:#120C0A;color:var(--muted);transition:opacity .4s}
.load.off{opacity:0;pointer-events:none}
.load i{display:block;width:120px;height:6px;background:var(--line);margin-top:10px;position:relative;overflow:hidden}
.load i::after{content:"";position:absolute;inset:0;width:40%;background:var(--accent);animation:ld 1s infinite linear}
@keyframes ld{from{left:-40%}to{left:100%}}
h2{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.roster{list-style:none;border-top:1px solid var(--line)}
.roster li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sw{width:12px;height:12px;border-radius:2px}
.nm{font-weight:600}.rl{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.st{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,#6b5b51)}
.st.kerja{--c:var(--ok);color:var(--fg)}.st.putus{--c:var(--no);color:var(--no)}.st.ngopi{--c:var(--accent)}
.logh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px}
.logh div{display:flex;gap:14px}
button{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
#feed{list-style:none;max-height:300px;overflow:auto;border-top:1px solid var(--line)}
#feed li{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
#feed time{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:1px}
#feed li.bad span.t{color:var(--no)}
#feed b{font-weight:600;margin-right:6px}
.empty{color:var(--muted);padding:14px 0;font-size:14px}
.note{margin-top:14px;color:var(--muted);font-size:12.5px}
@media(prefers-reduced-motion:reduce){.bub,.load{transition:none}.load i::after{animation:none}}
</style>
</head>
<body>
<div class="app">
<header><h1>Kantor Agen Ozami</h1><p>Demo · semua data simulasi</p></header>
<div class="grid">
 <div class="scene">
  <canvas id="c" width="240" height="160" aria-label="Ilustrasi kantor pixel: empat agen bekerja di meja masing-masing"></canvas>
  <div id="over"></div>
  <div class="load" id="load"><div>Menyambung ke kantor…<i></i></div></div>
 </div>
 <section>
  <h2>Siapa di kantor</h2>
  <ul class="roster" id="roster"></ul>
  <div class="logh"><h2>Catatan hari ini</h2><div><button id="b1">Simulasi rilis CRM</button><button id="b2">Hermes putus</button></div></div>
  <ul id="feed"><li class="empty" id="empty" style="display:block">Belum ada kegiatan. Agen akan muncul di sini begitu mulai bekerja.</li></ul>
  <p class="note">Papan di dinding kiri: tiap tempelan = satu pekerjaan terbaru, warnanya milik agen yang mengerjakan.</p>
 </section>
</div>
</div>
<script>
const cv=document.getElementById('c'),X=cv.getContext('2d'),LW=240,LH=160,OX=120,OY=60,H=44;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const P=(x,y,z=0)=>[OX+(x-y)*13,OY+(x+y)*6.5-z];
function px(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),w,h)}
function poly(p,c,a){X.fillStyle=c;if(a!=null)X.globalAlpha=a;
 let lo=Math.floor(Math.min(...p.map(q=>q[1]))),hi=Math.ceil(Math.max(...p.map(q=>q[1])));
 for(let y=lo;y<=hi;y++){const yy=y+.5,xs=[];
  for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];
   if((a[1]<=yy&&b[1]>yy)||(b[1]<=yy&&a[1]>yy))xs.push(a[0]+(yy-a[1])*(b[0]-a[0])/(b[1]-a[1]))}
  xs.sort((m,n)=>m-n);for(let i=0;i+1<xs.length;i+=2){const x0=Math.round(xs[i]),x1=Math.round(xs[i+1]);if(x1>x0)X.fillRect(x0,y,x1-x0,1)}}
 X.globalAlpha=1}
function box(x,y,w,d,z0,h,top,left,right){const z1=z0+h;
 poly([P(x,y,z1),P(x+w,y,z1),P(x+w,y+d,z1),P(x,y+d,z1)],top);
 poly([P(x,y+d,z1),P(x+w,y+d,z1),P(x+w,y+d,z0),P(x,y+d,z0)],left);
 poly([P(x+w,y+d,z1),P(x+w,y,z1),P(x+w,y,z0),P(x+w,y+d,z0)],right)}
const wallPlane=(a,b,z0,z1,c)=>poly([P(a,0,z1),P(b,0,z1),P(b,0,z0),P(a,0,z0)],c);   // dinding kanan (y=0)
const leftPlane=(a,b,z0,z1,c)=>poly([P(0,a,z1),P(0,b,z1),P(0,b,z0),P(0,a,z0)],c);   // dinding kiri (x=0)

/* ---------- agen ---------- */
const AG=[
 {id:'claude',n:'Claude',role:'Kode & rilis CRM',c:'#E8A49A',hair:'#2B1B14',skin:'#E3B38F',desk:[.8,1.3],deco:'headset'},
 {id:'hermes',n:'Hermes',role:'Bot Discord Ozami HQ',c:'#9FB4E8',hair:'#E9E2D6',skin:'#D9A47F',desk:[3.6,1.3],deco:'wings'},
 {id:'zamisyak',n:'Zamisyak',role:'Dashboard konten AI',c:'#8FD19E',hair:'#4A2F20',skin:'#F0C6A2',desk:[.8,4.7],deco:'cap'},
 {id:'web',n:'Pintu Web',role:'Situs & aaPanel',c:'#C9A3E8',hair:'#1C1C24',skin:'#C98F6B',desk:[3.6,4.7],deco:'glasses'}];
AG.forEach((a,i)=>{a.seat=[a.desk[0]+1.45,a.desk[1]-.15];a.aisle=a.desk[0]-.45;a.x=a.seat[0];a.y=a.seat[1];
 a.path=[];a.mode='duduk';a.state='diam';a.say='';a.sayT=0;a.errT=0;a.wait=0;a.next=15+i*9;a.task='';a.t=0});
const SH=[ "..hhhhh..",".hhhhhhh.",".hsssssh.",".sessses.",".sssssss.","..sssss..",".bbbbbbb.","sbbbabbbs","sbbbabbbs",".bbbbbbb."];
const LEG={s:["..ddddd..","..dd.dd..","..dd.dd..","..oo.oo.."],a:[".ddd.ddd.",".dd...dd.",".dd...dd.",".oo...oo."],b:["..ddddd..","...d.d...","..dd.dd..","..oo.oo.."]};
function spr(rows,ox,oy,pal){const pts=[];rows.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]!=='.')pts.push([i,j,r[i]])});
 X.fillStyle='#1A100C';pts.forEach(([i,j])=>{X.fillRect(ox+i-1,oy+j,3,1);X.fillRect(ox+i,oy+j-1,1,3)});
 pts.forEach(([i,j,ch])=>{X.fillStyle=pal[ch];X.fillRect(ox+i,oy+j,1,1)})}
function drawAgent(a,tm){const [fx,fy]=P(a.x,a.y);const seated=a.mode==='duduk';
 const frame=seated?'s':(Math.floor(tm/160)%2?'a':'b');
 const rows=seated?SH:SH.concat(a.walking?LEG[frame]:LEG.s);
 const ox=Math.round(fx)-4,oy=Math.round(fy)-(seated?16:14);
 if(!seated){poly([[fx-5,fy],[fx,fy-1.5],[fx+5,fy],[fx,fy+1.5]],'#000',.35)}
 spr(rows,ox,oy,{h:a.hair,s:a.skin,b:a.c,a:'#17110E',d:'#2A2230',o:'#120C0A',e:'#17110E'});
 if(a.deco==='wings'){px(ox-2,oy+1,2,1,'#F1E9E1');px(ox-3,oy,1,1,'#F1E9E1');px(ox+9,oy+1,2,1,'#F1E9E1');px(ox+11,oy,1,1,'#F1E9E1')}
 if(a.deco==='headset'){px(ox,oy+2,1,3,'#17110E');px(ox+8,oy+2,1,3,'#17110E');px(ox+1,oy,7,1,'#17110E')}
 if(a.deco==='cap'){px(ox+1,oy,7,2,'#F1E9E1');px(ox+7,oy+2,3,1,'#F1E9E1')}
 if(a.deco==='glasses'){px(ox+1,oy+3,3,1,'#F1E9E1');px(ox+5,oy+3,3,1,'#F1E9E1')}
 if(a.errT>0&&Math.floor(tm/300)%2){px(ox+4,oy-8,1,4,'#F2A0A0');px(ox+4,oy-3,1,1,'#F2A0A0')}
 a.sx=fx;a.sy=oy}

/* ---------- ruangan ---------- */
function scenery(tm){
 X.clearRect(0,0,LW,LH);px(0,0,LW,LH,'#120C0A');
 // dinding
 wallPlane(0,7,0,H,'#5A463B');leftPlane(0,7,0,H,'#47362E');
 wallPlane(0,7,0,3,'#2E221C');leftPlane(0,7,0,3,'#241913');
 // jendela senja
 [[.7,3.3],[3.7,6.3]].forEach(([a,b],k)=>{
  wallPlane(a-.08,b+.08,11,38,'#8A6A55');
  const sky=['#26304F','#3A3A63','#5F4A70','#A5607A','#D9807F','#E8A49A'];
  sky.forEach((c,i)=>wallPlane(a,b,12+i*4,16+i*4,c));
  const bl=[[0,.5,9],[.5,.9,5],[.9,1.5,12],[1.5,1.9,7],[1.9,2.6,10]];
  bl.forEach(([s,e,h],j)=>{const hh=h+(k*3+j)%4;wallPlane(a+s,Math.min(a+e,b),12,12+hh,'#1E1714');
   for(let q=0;q<3;q++){const [wx,wy]=P(a+s+.15+q*.17,0,12+3+((q*5+j*3)%Math.max(hh-4,2)));if(a+s+.15+q*.17<Math.min(a+e,b)-.05&&(q+j+k)%2==0)px(wx,wy,1,1,'#F1E9E1')}});
  wallPlane(a,b,12,13,'#120C0A')});
 wallPlane(.5,6.5,10,12,'#8A6A55');
 // papan tempelan (dinding kiri)
 leftPlane(1.1,4.3,15,42,'#C9BCAD');leftPlane(1.2,4.2,16,41,'#EDE5DA');
 for(let r=0;r<3;r++)for(let q=0;q<3;q++){const i=r*3+q,col=NOTES[i];if(!col)continue;
  const y0=1.4+q*.95,z0=18+r*7.5;leftPlane(y0,y0+.7,z0,z0+5.5,col);leftPlane(y0,y0+.7,z0+4.5,z0+5.5,'#00000022')}
 // pintu
 leftPlane(5.1,6.4,0,27,'#2E221C');leftPlane(5.2,6.3,1,26,'#3B2B23');{const [kx,ky]=P(0,6.15,13);px(kx,ky,1,2,'#E8A49A')}
 // lantai
 for(let x=0;x<7;x++)for(let y=0;y<7;y++)poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],(x+y)%2?'#6B4A36':'#62432F');
 for(let x=0;x<7;x++)for(let y=0;y<7;y++){const [a,b]=P(x+.5,y+.5);if((x*3+y*5)%4==0)px(a-2,b,3,1,'#5A3C2A')}
 // karpet lorong
 poly([P(.5,2.85),P(6.5,2.85),P(6.5,3.95),P(.5,3.95)],'#5A3A36');poly([P(.6,2.95),P(6.4,2.95),P(6.4,3.85),P(.6,3.85)],'#6E4642');
 // sisi lantai
 poly([P(0,7,0),P(7,7,0),P(7,7,-4),P(0,7,-4)],'#3A2A22');poly([P(7,7,0),P(7,0,0),P(7,0,-4),P(7,7,-4)],'#2B1F19');
}
const NOTES=[];
function addNote(c){NOTES.unshift(c);if(NOTES.length>9)NOTES.pop()}
['#E8A49A','#9FB4E8','#8FD19E','#C9A3E8','#E8A49A'].forEach(c=>NOTES.push(c));

function furniture(tm){const items=[];
 AG.forEach(a=>{const [dx,dy]=a.desk;
  items.push({k:dx+dy+3.3,f:()=>{
   poly([P(dx-.1,dy-.1),P(dx+2.1,dy-.1),P(dx+2.1,dy+1.15),P(dx-.1,dy+1.15)],'#000',.25);
   box(dx,dy,2,1,0,9,'#A27A5A','#6E4F3A','#7F5C44');
   poly([P(dx+1.2,dy+.3,9),P(dx+1.85,dy+.3,9),P(dx+1.85,dy+.75,9),P(dx+1.2,dy+.75,9)],'#EDE5DA');   // kertas
   box(dx+.95,dy+.55,.22,.22,9,5,'#F1E9E1','#C9BCAD','#B3A398');                                   // cangkir
   const on=a.state==='kerja'||a.state==='putus';
   if(on&&!REDUCED){poly([P(dx+.1,dy+.5,9),P(dx+.9,dy+.5,9),P(dx+1,dy+.95,9),P(dx,dy+.95,9)],a.state==='putus'?'#F2A0A0':a.c,.14+.06*Math.sin(tm/250))}
   box(dx+.25,dy+.28,.6,.06,9,5,'#CFC7BE','#8F877F','#A29A92');                                    // laptop (punggung)
   const [lx,ly]=P(dx+.5,dy+.34,11);const blink=REDUCED||Math.floor(tm/450)%2;
   px(lx,ly,2,2,a.state==='putus'?(blink?'#F2A0A0':'#6b3a3a'):on?(blink?a.c:'#fff'):'#5a4a42');
  }});
  items.push({k:a.seat[0]+a.seat[1]-.2,f:()=>{box(a.seat[0]-.32,a.seat[1]-.5,.64,.2,0,17,'#2A1F1A','#2A1F1A','#1F1612')}});
  items.push({k:a.x+a.y,f:()=>drawAgent(a,tm)})});
 // dispenser
 items.push({k:8.6,f:()=>{box(6.2,1.2,.6,.6,0,13,'#D9D2C8','#B7AFA4','#A39B90');box(6.28,1.28,.44,.44,13,12,'#B9DCEE','#8FBBD6','#7DA9C2');box(6.25,1.7,.18,.1,7,2,'#E8A49A','#E8A49A','#E8A49A')}});
 // tanaman
 [[.4,6.2],[6.3,5.9]].forEach(([x,y])=>items.push({k:x+y+.6,f:()=>{box(x,y,.5,.5,0,8,'#8A5A44','#6B4533','#5B3A2A');
  const [a,b]=P(x+.25,y+.25,8);[[-5,-9],[0,-14],[4,-10],[-2,-6],[3,-5],[-6,-4]].forEach(([i,j],n)=>px(a+i,b+j,4,4,n%2?'#4F8F5E':'#6FB07C'));px(a-1,b-6,2,6,'#3F6F4B')}}));
 items.sort((p,q)=>p.k-q.k).forEach(i=>i.f())}

/* ---------- gerak ---------- */
const COOLER=[6.45,2.55],AISLE=3.4;
function goCooler(a){if(a.mode!=='duduk'||a.errT>0)return;a.mode='jalan';a.state='jalan';
 a.path=[[a.aisle,a.seat[1]],[a.aisle,AISLE],[COOLER[0],AISLE],COOLER];a.after='ngopi'}
function goBack(a){a.mode='jalan';a.state='jalan';a.path=[[COOLER[0],AISLE],[a.aisle,AISLE],[a.aisle,a.seat[1]],a.seat];a.after='duduk'}
function step(a,dt){a.walking=false;
 if(a.errT>0){a.errT-=dt;if(a.errT<=0){a.state='diam'}}
 if(a.sayT>0)a.sayT-=dt;
 if(a.mode==='jalan'&&a.path.length){const [tx,ty]=a.path[0],dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy),sp=1.5*dt/1000;
  if(d<=sp){a.x=tx;a.y=ty;a.path.shift();if(!a.path.length){a.mode=a.after;if(a.after==='ngopi'){a.state='ngopi';a.wait=7000;say(a,'ngopi dulu')}else{a.mode='duduk';a.state='diam'}}}
  else{a.x+=dx/d*sp;a.y+=dy/d*sp;a.walking=true}}
 else if(a.mode==='ngopi'){a.wait-=dt;if(a.wait<=0)goBack(a)}
 else if(a.mode==='duduk'&&!REDUCED){a.next-=dt/1000;if(a.next<=0){a.next=30+Math.random()*30;if(Math.random()<.6)goCooler(a)}}}
function say(a,t){a.say=t;a.sayT=3600}

/* ---------- catatan & daftar ---------- */
const SC={claude:['membaca catatan-remote.md','pintu uji tes: 42 lulus','pintu rilis cek: aman','menunggu konfirmasi Owner'],
 hermes:['membalas di #vps-ops','cron: rekap harian jalan','kabar terkirim ke Discord'],
 zamisyak:['render carousel cover putih','cek niche: realita usaha','semua tes lulus'],
 web:['cadangkan ukara.co.id','cek SSL semua situs','ozami.co.id: 200','baca log nginx']};
const feed=document.getElementById('feed'),empty=document.getElementById('empty'),roster=document.getElementById('roster');
const wib=()=>new Date(Date.now()+7*36e5).toISOString().substr(11,5);
function log(a,t,bad){empty.style.display='none';const li=document.createElement('li');if(bad)li.className='bad';
 li.innerHTML=`<time>${wib()}</time><span class="t"><b style="color:${bad?'var(--no)':a.c}">${a.n}</b>${t}</span>`;feed.appendChild(li);feed.scrollTop=feed.scrollHeight;
 while(feed.children.length>40)feed.removeChild(feed.children[1]);
 say(a,t.length>28?t.slice(0,27)+'…':t);if(a.mode==='duduk'&&!bad)a.state='kerja';addNote(a.c)}
function work(a){if(a.mode!=='duduk'||a.errT>0)return;const s=SC[a.id];log(a,s[Math.floor(Math.random()*s.length)])}
AG.forEach(a=>{const li=document.createElement('li');li.innerHTML=`<i class="sw" style="background:${a.c}"></i><span class="nm">${a.n}<span class="rl">${a.role}</span></span><span class="st" id="st-${a.id}">diam</span>`;roster.appendChild(li)});
const STT={kerja:'bekerja',ngopi:'ngopi',jalan:'jalan',putus:'putus',diam:'diam'};
function paintRoster(){AG.forEach(a=>{const e=document.getElementById('st-'+a.id);const s=a.errT>0?'putus':a.state;e.textContent=STT[s];e.className='st '+s})}
setInterval(()=>{AG.forEach(a=>{if(a.state==='kerja'&&Math.random()<.25)a.state='diam'});work(AG[Math.floor(Math.random()*AG.length)])},3000);
setTimeout(()=>{AG.forEach((a,i)=>setTimeout(()=>work(a),i*350))},900);
document.getElementById('b1').onclick=()=>{const c=AG[0];['pintu rilis cek…','dump DB produksi','tes modul: hijau','cadangan selesai','rilis berhasil, /ozami/sehat OK'].forEach((t,i)=>setTimeout(()=>log(c,t),i*1000))};
document.getElementById('b2').onclick=()=>{const h=AG[1];h.errT=5200;h.state='putus';log(h,'koneksi Discord putus',true);
 setTimeout(()=>log(AG[0],'cek pintu kotak logs ozami-hermes'),1400);setTimeout(()=>log(AG[0],'minta izin Owner untuk restart'),2800);setTimeout(()=>log(h,'tersambung lagi'),5300)};

/* ---------- label di atas kanvas ---------- */
const over=document.getElementById('over');
AG.forEach(a=>{a.bub=document.createElement('div');a.bub.className='bub';over.appendChild(a.bub);a.tag=document.createElement('div');a.tag.className='tag';a.tag.textContent=a.n;over.appendChild(a.tag)});
