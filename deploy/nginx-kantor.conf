# aaPanel > Website > kantor.ozami.co.id (SSL Let's Encrypt) > Config: isi location / seperti ini
location / {
    proxy_pass http://127.0.0.1:8491;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;         # dipakai server untuk batas percobaan login per IP
    proxy_set_header X-Forwarded-Proto https;
}
