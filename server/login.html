<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk · Kantor Virtual Ozami</title>
<link rel="icon" href="/aset/ozami-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8F4;--panel:#FFFFFF;--line:#E7E0D5;--fg:#121521;--muted:#4F5A6B;--accent:#2453C9;--btn:#2453C9;--no:#DB2F22;--in:#FFFFFF;--logo:none;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121521;--panel:#1A1F2E;--line:#2E3446;--fg:#F6F3EE;--muted:#9AA3B5;--accent:#8BA4E3;--btn:#1C419D;--no:#F07A70;--in:#20263A;--logo:brightness(0) invert(.96);color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font:15px/1.45 "Outfit",system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:400px}
.logo{display:block;height:48px;width:auto;margin:0 auto 18px;filter:var(--logo)}
h1{text-align:center;font-size:26px;font-weight:600}
.sub{text-align:center;color:var(--muted);margin:4px 0 22px}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
label{display:block;font-weight:500;margin:0 0 6px}
input{width:100%;font:inherit;color:var(--fg);background:var(--in);border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:16px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;font:inherit;font-weight:600;color:#fff;background:var(--btn);border:0;border-radius:7px;padding:11px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--no);background:transparent;border:1px solid var(--no);border-radius:7px;padding:8px 10px;margin-bottom:16px;font-size:14px}
.note{color:var(--muted);font-size:13px;text-align:center;margin-top:16px}
.note a{color:var(--accent)}
</style>
</head>
<body>
<main>
 <img class="logo" src="/aset/ozami-logo.png" alt="Ozami Inti Sinergi" width="460" height="176">
 <h1>Kantor Virtual</h1>
 <p class="sub">Masuk dengan akun CRM Ozami</p>
 <form method="post" action="/login">
  {{PESAN}}
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required value="{{EMAIL}}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Masuk</button>
 </form>
 <p class="note">Lupa password? Atur ulang di <a href="{{CRM}}">CRM Ozami</a>.</p>
</main>
</body>
</html>
